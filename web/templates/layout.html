{{define "layout"}}
<!DOCTYPE html>
<html lang="en">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>Claude Gate{{if .Title}} - {{.Title}}{{end}}</title>
	<link rel="stylesheet" href="/admin/static/style.css">
	<script src="/admin/static/htmx.min.js"></script>
</head>
<body>
	<nav>
		<a class="brand" href="/admin/">Claude Gate</a>
		<a href="/admin/" {{if eq .Nav "dashboard"}}class="active"{{end}}>Dashboard</a>
		<a href="/admin/real-tokens" {{if eq .Nav "real-tokens"}}class="active"{{end}}>Real Tokens</a>
		<a href="/admin/gate-tokens" {{if eq .Nav "gate-tokens"}}class="active"{{end}}>Gate Tokens</a>
		<a href="/admin/logout">Logout</a>
	</nav>
	<main>
		{{template "content" .}}
	</main>
</body>
</html>
{{end}}
